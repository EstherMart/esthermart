name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#D162A4&color_dots=#1a1a1a,#FFD9BD,#FF9A56,#EF7627,#D52D00
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D162A4&color_dots=#1a1a1a,#FFD9BD,#FF9A56,#EF7627,#D52D00

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
